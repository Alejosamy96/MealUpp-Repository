spring.application.name=MealUpp-Repository
spring.profiles.active=test

# En las pruebas se usa H2 en memoria: no hace falta tener PostgreSQL instalado
spring.datasource.url=jdbc:h2:mem:mealup;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Credenciales solo para pruebas
mealup.staff.username=staff
mealup.staff.password=test-password

mealup.time-zone=America/Bogota
mealup.orders.cutoff-time=10:30
mealup.orders.delivery-start=11:30
mealup.orders.delivery-end=14:00
mealup.orders.min-quantity=1
mealup.orders.max-quantity=10
