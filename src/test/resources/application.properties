spring.application.name=MealUpp-Repository
spring.profiles.active=test

# En las pruebas se usa H2 en memoria: no hace falta tener PostgreSQL instalado
spring.datasource.url=jdbc:h2:mem:mealup;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Credenciales y claves solo para pruebas
mealup.staff.username=staff
mealup.staff.password=test-password
mealup.staff.token-hours=8
mealup.security.jwt-secret=clave-de-pruebas-clave-de-pruebas-0123456789
mealup.cors.allowed-origins=http://localhost:5173

mealup.time-zone=America/Bogota
mealup.orders.cutoff-time=10:30
mealup.orders.delivery-start=11:30
mealup.orders.delivery-end=14:00
mealup.orders.min-quantity=1
mealup.orders.max-quantity=10
mealup.orders.max-per-day=100

mealup.payments.required=false
mealup.payments.provider=sandbox
mealup.payments.webhook-secret=secreto-del-webhook-de-pruebas
mealup.payments.expiration-minutes=15
mealup.payments.expiration-check-ms=60000
mealup.payments.currency=COP
mealup.payments.sandbox-checkout-url=http://localhost:5173/pago-simulado
mealup.payments.sandbox-enabled=true
mealup.scheduling.enabled=false

mealup.storage.type=local
mealup.storage.local-dir=target/test-media
mealup.media.base-url=/media
mealup.media.thumbnail-size=400
mealup.media.detail-size=1200

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
