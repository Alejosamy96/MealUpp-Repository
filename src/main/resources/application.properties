spring.application.name=MealUpp-Repository

# ---------- Base de datos (las credenciales vienen de variables de entorno) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealup}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# ---------- Acceso del personal ----------
# Cuenta inicial de la administradora: se crea sola si no hay personal registrado.
mealup.staff.username=${STAFF_USERNAME:ferxxos}
mealup.staff.password=${STAFF_PASSWORD}
mealup.staff.token-hours=8
# Clave con la que se firman los tokens (JWT). Mínimo 32 caracteres.
mealup.security.jwt-secret=${JWT_SECRET}
# Orígenes del frontend que pueden llamar a la API (separados por coma).
mealup.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- Reglas de pedidos (confirmadas por la administradora) ----------
mealup.time-zone=America/Bogota
mealup.orders.cutoff-time=10:30
mealup.orders.delivery-start=11:30
mealup.orders.delivery-end=14:00
mealup.orders.min-quantity=1
mealup.orders.max-quantity=10
mealup.orders.max-per-day=100

# ---------- Pagos en línea ----------
# required=true: el pedido queda pendiente de pago hasta que la pasarela lo confirme.
mealup.payments.required=${PAYMENTS_REQUIRED:true}
mealup.payments.provider=${PAYMENT_PROVIDER:sandbox}
mealup.payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET}
mealup.payments.expiration-minutes=15
mealup.payments.expiration-check-ms=60000
mealup.payments.currency=COP
mealup.payments.sandbox-checkout-url=${SANDBOX_CHECKOUT_URL:http://localhost:5173/pago-simulado}
# Mercado Pago (solo con PAYMENT_PROVIDER=mercadopago)
mealup.payments.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mealup.payments.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mealup.payments.mercadopago.api-url=${MERCADOPAGO_API_URL:https://api.mercadopago.com}
# Dirección pública HTTPS de este backend (en pruebas, la de ngrok) + /api/payments/mercadopago/webhook
mealup.payments.mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}
mealup.payments.mercadopago.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Pasarela simulada (rutas /api/payments/sandbox). APAGARLA en producción.
mealup.payments.sandbox-enabled=${SANDBOX_ENABLED:true}
mealup.scheduling.enabled=true

# ---------- Fotos de los platos ----------
# type=local: se guardan en una carpeta y se sirven en /media. type=s3: almacenamiento compatible con S3.
mealup.storage.type=${STORAGE_TYPE:local}
mealup.storage.local-dir=${MEDIA_DIR:./media}
mealup.storage.s3.endpoint=${S3_ENDPOINT:}
mealup.storage.s3.bucket=${S3_BUCKET:}
mealup.storage.s3.region=${S3_REGION:auto}
mealup.storage.s3.access-key=${S3_ACCESS_KEY:}
mealup.storage.s3.secret-key=${S3_SECRET_KEY:}
# Dirección pública de las fotos: /media en local, o la del CDN en producción.
mealup.media.base-url=${MEDIA_BASE_URL:/media}
mealup.media.thumbnail-size=400
mealup.media.detail-size=1200
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Operación ----------
management.endpoints.web.exposure.include=health
server.forward-headers-strategy=framework
server.shutdown=graceful
