spring.application.name=MealUpp-Repository

# Base de datos: las credenciales se leen de variables de entorno (DoD #7)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealup}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Usuario del personal del restaurante (HU-05). La contraseña viene de variable de entorno.
mealup.staff.username=${STAFF_USERNAME:ferxxos}
mealup.staff.password=${STAFF_PASSWORD}

# Reglas de pedidos (HU-02). Valores provisionales, pendientes de confirmar con Nataly.
mealup.time-zone=America/Bogota
mealup.orders.cutoff-time=10:30
mealup.orders.delivery-start=11:30
mealup.orders.delivery-end=14:00
mealup.orders.min-quantity=1
mealup.orders.max-quantity=10
